- name: medserl_selfplay_agent
  _target_: scripts.self_play.agent_loop.medserl_selfplay_agent.MedSerlSelfPlayAgentLoop
  detection_prompts_path: configs/prompts/detection_localization_prompts.json
  injector_max_new_tokens: 1536  # deliberate v7 experiment: bigger think budget than v6's 1024; watch injector waste%/at-cap% trend in game_health.py to see if -1.5 teaches compression. NOTE: 2048 crashed (response 8386 > 8192); 1536 observed max 7915 -> thin ~280 margin, autorestart+resume covers a rare overflow.
  assessor_max_new_tokens: 2048
  assessor_think_max_new_tokens: 2048
  assessor_final_max_new_tokens: 256
  assessor_temperature: 1.0
