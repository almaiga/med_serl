# MedSeRL Self-Play Configuration for veRL REINFORCE++
#
# Based on veRL's _generated_ppo_trainer.yaml (official reference).
# Standalone config: no Hydra defaults composition, all fields declared.
# The auto-patcher in run_agentic_train_smoke.sh will remove any fields
# that don't exist in the installed veRL version at runtime.

# --- Data ---
data:
  tokenizer: null
  use_shm: false
  train_files:
    - data_processed/self_play/train.parquet
  val_files:
    - data_processed/self_play/val.parquet
  train_max_samples: -1
  val_max_samples: -1
  prompt_key: prompt
  reward_fn_key: data_source
  max_prompt_length: 2048
  max_response_length: 4096
  train_batch_size: 32
  val_batch_size: 32
  tool_config_path: null
  return_raw_input_ids: false
  return_raw_chat: true
  return_full_prompt: false
  shuffle: true
  seed: 42
  dataloader_num_workers: 8
  image_patch_size: 14
  validation_shuffle: false
  filter_overlong_prompts: false
  filter_overlong_prompts_workers: 1
  truncation: error
  image_key: images
  video_key: videos
  trust_remote_code: true
  custom_cls:
    path: null
    name: null
  return_multi_modal_inputs: true
  sampler:
    class_path: null
    class_name: null
  datagen:
    path: null
    name: null
  apply_chat_template_kwargs: {}

# --- Actor / Rollout / Reference ---
actor_rollout_ref:
  hybrid_engine: true
  nccl_timeout: 600

  model:
    _target_: verl.workers.config.HFModelConfig
    path: "Qwen/Qwen3-4B"
    hf_config_path: null
    tokenizer_path: null
    use_shm: false
    trust_remote_code: true
    custom_chat_template: null
    external_lib: null
    override_config:
      attn_implementation: flash_attention_2
    enable_gradient_checkpointing: true
    enable_activation_offload: false
    use_remove_padding: false
    lora_rank: 0
    lora_alpha: 16
    target_modules: all-linear
    exclude_modules: null
    lora_adapter_path: null
    use_liger: false
    use_fused_kernels: false
    fused_kernel_options:
      impl_backend: torch
    tiled_mlp:
      enabled: false
      num_shards: 4
    mtp:
      _target_: verl.workers.config.MtpConfig
      enable: false
      enable_train: false
      enable_rollout: false
      detach_encoder: false
      mtp_loss_scaling_factor: 0.1
      speculative_algorithm: EAGLE
      speculative_num_steps: 3
      speculative_eagle_topk: 1
      speculative_num_draft_tokens: 4
      method: mtp
      num_speculative_tokens: 1

  actor:
    _target_: verl.workers.config.FSDPActorConfig
    strategy: fsdp
    rollout_n: 1
    ppo_mini_batch_size: 4
    ppo_micro_batch_size: null
    ppo_micro_batch_size_per_gpu: 1
    use_dynamic_bsz: false
    ppo_max_token_len_per_gpu: 16384
    grad_clip: 1.0
    clip_ratio: 0.2
    clip_ratio_low: 0.2
    clip_ratio_high: 0.2
    clip_ratio_c: 3.0
    tau_pos: 1.0
    tau_neg: 1.05
    freeze_vision_tower: false
    policy_loss:
      _target_: verl.workers.config.PolicyLossConfig
      loss_mode: vanilla
      clip_cov_ratio: 0.0002
      clip_cov_lb: 1.0
      clip_cov_ub: 5.0
      kl_cov_ratio: 0.0002
      ppo_kl_coef: 0.1
    loss_agg_mode: token-mean
    loss_scale_factor: null
    entropy_coeff: 0.0
    calculate_entropy: false
    use_kl_loss: false
    use_prefix_grouper: false
    use_torch_compile: false
    kl_loss_coef: 0.001
    kl_loss_type: low_var_kl
    ppo_epochs: 1
    shuffle: false
    data_loader_seed: 42
    checkpoint:
      _target_: verl.trainer.config.CheckpointConfig
      save_contents:
        - model
        - optimizer
        - extra
      load_contents:
        - model
        - optimizer
        - extra
      async_save: false
      mbridge_config: {}
    use_fused_kernels: false
    profiler:
      _target_: verl.utils.profiler.ProfilerConfig
      tool: null
      enable: false
      all_ranks: false
      ranks: []
      save_path: null
      tool_config:
        nsys:
          _target_: verl.utils.profiler.config.NsightToolConfig
          discrete: false
        npu:
          _target_: verl.utils.profiler.config.NPUToolConfig
          contents: []
          level: level0
          analysis: true
          discrete: false
        torch:
          _target_: verl.utils.profiler.config.TorchProfilerToolConfig
          contents: []
          discrete: false
        torch_memory:
          _target_: verl.utils.profiler.config.TorchMemoryToolConfig
          trace_alloc_max_entries: 100000
          stack_depth: 32
    router_replay:
      _target_: verl.workers.config.RouterReplayConfig
      mode: disabled
      record_file: null
      replay_file: null
    ulysses_sequence_parallel_size: 1
    entropy_from_logits_with_chunking: false
    entropy_checkpointing: false
    use_remove_padding: false
    calculate_sum_pi_squared: false
    sum_pi_squared_checkpointing: false
    qat:
      enable: false
      mode: w4a16
      group_size: 16
      ignore_patterns:
        - lm_head
        - embed_tokens
        - "re:.*mlp.gate$"
      activation_observer: static_minmax
      quantization_config_path: null
    optim:
      _target_: verl.workers.config.FSDPOptimizerConfig
      optimizer: AdamW
      optimizer_impl: torch.optim
      lr: 5e-7
      lr_warmup_steps_ratio: 0.03
      total_training_steps: -1
      weight_decay: 0.01
      lr_warmup_steps: -1
      betas:
        - 0.9
        - 0.999
      clip_grad: 1.0
      min_lr_ratio: 0.0
      num_cycles: 0.5
      lr_scheduler_type: cosine
      zero_indexed_step: true
      warmup_style: null
      override_optimizer_config: null
    fsdp_config:
      _target_: verl.workers.config.FSDPEngineConfig
      wrap_policy:
        min_num_params: 0
      param_offload: false
      optimizer_offload: false
      offload_policy: false
      reshard_after_forward: true
      fsdp_size: -1
      forward_prefetch: false
      model_dtype: fp32
      use_orig_params: false
      seed: 42
      full_determinism: false
      ulysses_sequence_parallel_size: 1
      entropy_from_logits_with_chunking: false
      use_torch_compile: false
      entropy_checkpointing: false
      forward_only: false
      strategy: fsdp
      dtype: bfloat16

  ref:
    _target_: verl.workers.config.FSDPActorConfig
    rollout_n: 1
    strategy: fsdp
    use_torch_compile: false
    log_prob_micro_batch_size: null
    log_prob_micro_batch_size_per_gpu: 8
    log_prob_use_dynamic_bsz: false
    log_prob_max_token_len_per_gpu: 16384
    profiler:
      _target_: verl.utils.profiler.ProfilerConfig
      tool: null
      enable: false
      all_ranks: false
      ranks: []
      save_path: null
      tool_config:
        nsys:
          _target_: verl.utils.profiler.config.NsightToolConfig
          discrete: false
        npu:
          _target_: verl.utils.profiler.config.NPUToolConfig
          contents: []
          level: level0
          analysis: true
          discrete: false
        torch:
          _target_: verl.utils.profiler.config.TorchProfilerToolConfig
          contents: []
          discrete: false
        torch_memory:
          _target_: verl.utils.profiler.config.TorchMemoryToolConfig
          trace_alloc_max_entries: 100000
          stack_depth: 32
    router_replay:
      _target_: verl.workers.config.RouterReplayConfig
      mode: disabled
      record_file: null
      replay_file: null
    fsdp_config:
      _target_: verl.workers.config.FSDPEngineConfig
      wrap_policy:
        min_num_params: 0
      param_offload: false
      optimizer_offload: false
      offload_policy: false
      reshard_after_forward: true
      fsdp_size: -1
      forward_prefetch: false
      model_dtype: fp32
      use_orig_params: false
      seed: 42
      full_determinism: false
      ulysses_sequence_parallel_size: 1
      entropy_from_logits_with_chunking: false
      use_torch_compile: false
      entropy_checkpointing: false
      forward_only: true
      strategy: fsdp
      dtype: bfloat16
    ulysses_sequence_parallel_size: 1
    entropy_from_logits_with_chunking: false
    entropy_checkpointing: false

  rollout:
    _target_: verl.workers.config.RolloutConfig
    name: vllm
    mode: async
    temperature: 1.0
    top_k: 20
    top_p: 1.0
    prompt_length: 2048
    response_length: 2048
    dtype: bfloat16
    gpu_memory_utilization: 0.5
    ignore_eos: false
    enforce_eager: true
    cudagraph_capture_sizes: null
    free_cache_engine: true
    tensor_model_parallel_size: 1
    data_parallel_size: 1
    expert_parallel_size: 1
    pipeline_model_parallel_size: 1
    max_num_batched_tokens: 8192
    max_model_len: null
    max_num_seqs: 1024
    enable_chunked_prefill: true
    enable_prefix_caching: true
    logprobs_mode: processed_logprobs
    scheduling_policy: fcfs
    load_format: dummy
    log_prob_micro_batch_size: null
    log_prob_micro_batch_size_per_gpu: 8
    log_prob_use_dynamic_bsz: false
    log_prob_max_token_len_per_gpu: 16384
    disable_log_stats: true
    do_sample: true
    n: 1
    over_sample_rate: 0
    multi_stage_wake_up: false
    engine_kwargs:
      vllm: {}
      sglang: {}
      trtllm: {}
    val_kwargs:
      _target_: verl.workers.config.SamplingConfig
      top_k: -1
      top_p: 1.0
      temperature: 0
      n: 1
      do_sample: false
    multi_turn:
      _target_: verl.workers.config.MultiTurnConfig
      enable: false
      max_assistant_turns: null
      tool_config_path: null
      max_user_turns: null
      max_parallel_calls: 1
      max_tool_response_length: 256
      tool_response_truncate_side: middle
      interaction_config_path: null
      use_inference_chat_template: false
      tokenization_sanity_check_mode: strict
      format: hermes
      num_repeat_rollouts: null
    calculate_log_probs: false
    agent:
      _target_: verl.workers.config.AgentLoopConfig
      num_workers: 8
      default_agent_loop: single_turn_agent
      agent_loop_config_path: null
      custom_async_server:
        _target_: verl.workers.config.CustomAsyncServerConfig
        path: null
        name: null
    checkpoint_engine:
      _target_: verl.workers.config.CheckpointEngineConfig
      backend: naive
      update_weights_bucket_megabytes: 2048
      engine_kwargs: {}
    trace:
      _target_: verl.workers.config.TraceConfig
      backend: null
      token2text: false
      max_samples_per_step_per_worker: null
    skip_rollout: false
    skip_dump_dir: /tmp/rollout_dump
    skip_tokenizer_init: true
    enable_rollout_routing_replay: false
    profiler:
      _target_: verl.utils.profiler.ProfilerConfig
      tool: null
      enable: false
      all_ranks: false
      ranks: []
      save_path: null
      tool_config:
        npu:
          _target_: verl.utils.profiler.config.NPUToolConfig
          contents: []
          level: level0
          analysis: false
          discrete: false
        torch:
          _target_: verl.utils.profiler.config.TorchProfilerToolConfig
          contents: []
          discrete: false
    prometheus:
      _target_: verl.workers.config.PrometheusConfig
      enable: false
      port: 9090
      file: /tmp/ray/session_latest/metrics/prometheus/prometheus.yml
      served_model_name: null
    quantization: null
    quantization_config_file: null
    mtp: null
    qat: null
    layered_summon: false
    server: null
    layer_name_map: {}
    limit_images: null

# --- Critic ---
critic:
  _target_: verl.workers.config.FSDPCriticConfig
  enable: true
  strategy: fsdp
  rollout_n: 1
  ppo_mini_batch_size: 4
  ppo_micro_batch_size: null
  ppo_micro_batch_size_per_gpu: 1
  use_dynamic_bsz: false
  ppo_max_token_len_per_gpu: 16384
  forward_max_token_len_per_gpu: 16384
  ppo_epochs: 1
  shuffle: false
  data_loader_seed: 42
  cliprange_value: 0.5
  loss_agg_mode: token-mean
  forward_micro_batch_size: null
  forward_micro_batch_size_per_gpu: null
  ulysses_sequence_parallel_size: 1
  grad_clip: 1.0
  model:
    _target_: verl.workers.config.FSDPCriticModelCfg
    path: "Qwen/Qwen3-4B"
    tokenizer_path: "Qwen/Qwen3-4B"
    external_lib: null
    trust_remote_code: true
    override_config:
      attn_implementation: flash_attention_2
    use_shm: false
    enable_gradient_checkpointing: true
    enable_activation_offload: false
    use_remove_padding: false
    lora_rank: 0
    lora_alpha: 16
    target_modules: all-linear
    fsdp_config:
      _target_: verl.workers.config.FSDPEngineConfig
      wrap_policy:
        min_num_params: 0
      param_offload: false
      optimizer_offload: false
      offload_policy: false
      reshard_after_forward: true
      fsdp_size: -1
      forward_prefetch: false
      model_dtype: fp32
      use_orig_params: false
      seed: 42
      full_determinism: false
      ulysses_sequence_parallel_size: 1
      entropy_from_logits_with_chunking: false
      use_torch_compile: false
      entropy_checkpointing: false
      forward_only: false
      strategy: fsdp
      dtype: bfloat16
    tiled_mlp:
      enabled: false
      num_shards: 4
  optim:
    _target_: verl.workers.config.FSDPOptimizerConfig
    optimizer: AdamW
    optimizer_impl: torch.optim
    lr: 1e-5
    lr_warmup_steps_ratio: 0.0
    total_training_steps: -1
    weight_decay: 0.01
    lr_warmup_steps: -1
    betas:
      - 0.9
      - 0.999
    clip_grad: 1.0
    min_lr_ratio: 0.0
    num_cycles: 0.5
    lr_scheduler_type: constant
    zero_indexed_step: true
    warmup_style: null
    override_optimizer_config: null
  checkpoint:
    _target_: verl.trainer.config.CheckpointConfig
    save_contents:
      - model
      - optimizer
      - extra
    load_contents:
      - model
      - optimizer
      - extra
    async_save: false
    mbridge_config: {}
  profiler:
    _target_: verl.utils.profiler.ProfilerConfig
    tool: null
    enable: false
    all_ranks: false
    ranks: []
    save_path: null
    tool_config:
      nsys:
        _target_: verl.utils.profiler.config.NsightToolConfig
        discrete: false
      npu:
        _target_: verl.utils.profiler.config.NPUToolConfig
        contents: []
        level: level0
        analysis: true
        discrete: false
      torch:
        _target_: verl.utils.profiler.config.TorchProfilerToolConfig
        contents: []
        discrete: false
      torch_memory:
        _target_: verl.utils.profiler.config.TorchMemoryToolConfig
        trace_alloc_max_entries: 100000
        stack_depth: 32

# --- Reward Model (legacy) ---
reward_model:
  num_workers: null
  reward_manager: null
  enable: null
  enable_resource_pool: null
  n_gpus_per_node: null
  nnodes: null
  reward_loop_source: null
  reward_loop_module_path: null
  reward_loop_class_name: null
  model:
    path: null
    external_lib: null
    trust_remote_code: null
  rollout:
    name: null
    dtype: null
    gpu_memory_utilization: null
    enforce_eager: null
    cudagraph_capture_sizes: null
    free_cache_engine: null
    data_parallel_size: null
    expert_parallel_size: null
    tensor_model_parallel_size: null
    max_num_batched_tokens: null
    max_model_len: null
    max_num_seqs: null
    load_format: null
    engine_kwargs: null
    limit_images: null
    enable_chunked_prefill: null
    enable_prefix_caching: null
    disable_log_stats: null
    skip_tokenizer_init: null
    prompt_length: null
    response_length: null

# --- Custom Reward Function (top-level, legacy) ---
custom_reward_function:
  path: scripts.self_play.agentic_reward
  name: compute_score

# --- Sandbox Fusion ---
sandbox_fusion:
  url: null
  max_concurrent: null
  memory_limit_mb: null

# --- Reward (new config) ---
reward:
  num_workers: 8
  custom_reward_function:
    path: null
    name: compute_score
  reward_manager:
    _target_: verl.workers.config.reward_model.RewardManagerConfig
    source: register
    name: naive
    module:
      _target_: verl.trainer.config.config.ModuleConfig
      path: null
      name: custom_reward_manager
  reward_model:
    enable: false
    enable_resource_pool: false
    n_gpus_per_node: 1
    nnodes: 0
    model_path: null
    rollout:
      _target_: verl.workers.config.RolloutConfig
      name: vllm
      dtype: bfloat16
      gpu_memory_utilization: 0.5
      enforce_eager: true
      cudagraph_capture_sizes: null
      free_cache_engine: true
      data_parallel_size: 1
      expert_parallel_size: 1
      tensor_model_parallel_size: 1
      max_num_batched_tokens: 8192
      max_model_len: null
      max_num_seqs: 1024
      load_format: auto
      engine_kwargs: {}
      limit_images: null
      enable_chunked_prefill: true
      enable_prefix_caching: true
      disable_log_stats: true
      skip_tokenizer_init: false
      prompt_length: 2048
      response_length: 2048
  sandbox_fusion:
    url: null
    max_concurrent: 64
    memory_limit_mb: 1024

# --- Algorithm (REINFORCE++) ---
algorithm:
  _target_: verl.trainer.config.AlgoConfig
  gamma: 1.0
  lam: 0.95
  adv_estimator: reinforce_plus_plus
  norm_adv_by_std_in_grpo: true
  use_kl_in_reward: false
  kl_penalty: kl
  kl_ctrl:
    _target_: verl.trainer.config.KLControlConfig
    type: fixed
    kl_coef: 0.01
    horizon: 10000
    target_kl: 0.1
  use_pf_ppo: false
  pf_ppo:
    reweight_method: pow
    weight_pow: 2.0
  rollout_correction:
    rollout_is: null
    rollout_is_threshold: 2.0
    rollout_rs: null
    rollout_rs_threshold: null
    bypass_mode: false
    loss_type: ppo_clip
    rollout_is_batch_normalize: false

# --- Trainer ---
trainer:
  balance_batch: true
  total_epochs: 10
  total_training_steps: null
  project_name: medserl_selfplay
  experiment_name: selfplay_v1
  logger:
    - console
  log_val_generations: 0
  rollout_data_dir: null
  validation_data_dir: null
  nnodes: 1
  n_gpus_per_node: 1
  save_freq: 50
  esi_redundant_time: 0
  resume_mode: auto
  resume_from_path: null
  val_before_train: false
  val_only: false
  test_freq: 50
  critic_warmup: 0
  default_hdfs_dir: null
  del_local_ckpt_after_load: false
  default_local_dir: outputs/self_play
  max_actor_ckpt_to_keep: null
  max_critic_ckpt_to_keep: null
  ray_wait_register_center_timeout: 300
  device: cuda
  use_legacy_worker_impl: auto

# --- Transfer Queue ---
transfer_queue:
  enable: false

# --- Global Profiler ---
global_profiler:
  _target_: verl.utils.profiler.ProfilerConfig
  tool: null
  enable: false
  all_ranks: false
  ranks: []
  save_path: "outputs/profile"
  global_tool_config:
    nsys:
      _target_: verl.utils.profiler.config.NsightToolConfig
      discrete: false
      controller_nsight_options:
        trace: "cuda,nvtx,cublas,ucx"
        cuda-memory-usage: "true"
        cuda-graph-trace: graph
      worker_nsight_options:
        trace: "cuda,nvtx,cublas,ucx"
        cuda-memory-usage: "true"
        cuda-graph-trace: graph
        capture-range: cudaProfilerApi
        capture-range-end: null
        kill: none
    torch_memory:
      trace_alloc_max_entries: 100000
      stack_depth: 32
      context: all
      stacks: all
      kw_args: {}

# --- Ray Configuration ---
ray_kwargs:
  ray_init:
    num_cpus: null
  timeline_json_file: null
