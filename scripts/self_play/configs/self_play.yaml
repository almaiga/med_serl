# MedSeRL Self-Play Configuration for verl REINFORCE++
#
# COMPREHENSIVE standalone config — includes ALL veRL required fields.
# Since this config bypasses Hydra defaults composition (no `defaults:` section),
# every field that veRL accesses at runtime must be declared here.
# Cross-referenced against: ppo_trainer.yaml, legacy_data.yaml, actor.yaml,
# rollout.yaml, ray_trainer.py (RayPPOTrainer source).

# ─── Data ─────────────────────────────────────────────────────────────────────
data:
  tokenizer: null
  use_shm: false
  train_files:
    - data_processed/self_play/train.parquet
  val_files:
    - data_processed/self_play/val.parquet
  train_max_samples: -1
  val_max_samples: -1
  prompt_key: prompt
  reward_fn_key: data_source
  max_prompt_length: 2048
  max_response_length: 4096
  tool_config_path: null
  return_raw_input_ids: false
  return_raw_chat: true
  return_full_prompt: false
  train_batch_size: 32
  val_batch_size: 32
  shuffle: true
  seed: 42
  dataloader_num_workers: 8
  image_patch_size: 14
  validation_shuffle: false
  filter_overlong_prompts: false
  filter_overlong_prompts_workers: 1
  truncation: error
  image_key: images
  video_key: videos
  trust_remote_code: true
  custom_cls:
    path: null
    name: null
  return_multi_modal_inputs: true
  sampler: null
  datagen:
    path: null
    name: null
  apply_chat_template_kwargs: {}

# ─── Actor / Rollout / Reference ──────────────────────────────────────────────
actor_rollout_ref:
  hybrid_engine: true
  nccl_timeout: 600

  model:
    path: "Qwen/Qwen3-4B"
    external_lib: null
    override_config:
      attn_implementation: flash_attention_2
    enable_gradient_checkpointing: true
    enable_activation_offload: false
    trust_remote_code: true
    use_remove_padding: false

  actor:
    _target_: verl.workers.config.FSDPActorConfig
    strategy: fsdp
    rollout_n: 1
    ppo_mini_batch_size: 4
    ppo_micro_batch_size: null
    ppo_micro_batch_size_per_gpu: 1
    use_dynamic_bsz: false
    ppo_max_token_len_per_gpu: 16384
    grad_clip: 1.0
    clip_ratio: 0.2
    clip_ratio_low: 0.2
    clip_ratio_high: 0.2
    clip_ratio_c: 3.0
    tau_pos: 1.0
    tau_neg: 1.05
    freeze_vision_tower: false
    policy_loss:
      _target_: verl.workers.config.PolicyLossConfig
      loss_mode: "vanilla"
      clip_cov_ratio: 0.0002
      clip_cov_lb: 1.0
      clip_cov_ub: 5.0
      kl_cov_ratio: 0.0002
      ppo_kl_coef: 0.1
    loss_agg_mode: token-mean
    loss_scale_factor: null
    entropy_coeff: 0.0
    calculate_entropy: false
    use_kl_loss: false
    use_prefix_grouper: false
    use_torch_compile: false
    use_fused_kernels: false
    kl_loss_coef: 0.001
    kl_loss_type: low_var_kl
    ppo_epochs: 1
    shuffle: false
    data_loader_seed: 42
    ulysses_sequence_parallel_size: 1
    optim:
      _target_: verl.workers.config.FSDPOptimizerConfig
      lr: 5e-7
      lr_warmup_steps: -1
      lr_warmup_steps_ratio: 0.03
      min_lr_ratio: 0.0
      num_cycles: 0.5
      lr_scheduler_type: cosine
      total_training_steps: -1
      weight_decay: 0.01
    fsdp_config:
      _target_: verl.workers.config.FSDPEngineConfig
      wrap_policy:
        min_num_params: 0
      param_offload: false
      optimizer_offload: false
      fsdp_size: -1
    checkpoint:
      _target_: verl.trainer.config.CheckpointConfig
      save_contents: ['model', 'optimizer', 'extra']
      load_contents: ['model', 'optimizer', 'extra']
      async_save: false
      mbridge_config: {}
    profiler:
      _target_: verl.utils.profiler.ProfilerConfig
      tool: null
      enable: false
      all_ranks: false
      ranks: []
      save_path: null
      tool_config:
        nsys:
          _target_: verl.utils.profiler.config.NsightToolConfig
          discrete: false
        npu:
          _target_: verl.utils.profiler.config.NPUToolConfig
          contents: []
          level: "level0"
          analysis: true
          discrete: false
        torch:
          _target_: verl.utils.profiler.config.TorchProfilerToolConfig
          contents: []
          discrete: false
        torch_memory:
          _target_: verl.utils.profiler.config.TorchMemoryToolConfig
          trace_alloc_max_entries: 100000
          stack_depth: 32
    router_replay:
      _target_: verl.workers.config.RouterReplayConfig
      mode: disabled
      record_file: null
      replay_file: null

  rollout:
    _target_: verl.workers.config.RolloutConfig
    name: vllm
    mode: async
    nnodes: 0
    n_gpus_per_node: 1
    temperature: 1.0
    top_p: 1.0
    top_k: 20
    do_sample: true
    n: 1
    over_sample_rate: 0
    prompt_length: 2048
    response_length: 2048
    dtype: bfloat16
    gpu_memory_utilization: 0.5
    ignore_eos: false
    enforce_eager: true
    cudagraph_capture_sizes: null
    free_cache_engine: true
    load_format: dummy_dtensor
    tensor_model_parallel_size: 1
    data_parallel_size: 1
    expert_parallel_size: 1
    pipeline_model_parallel_size: 1
    max_num_batched_tokens: 8192
    max_model_len: null
    max_num_seqs: 1024
    enable_chunked_prefill: true
    enable_prefix_caching: true
    logprobs_mode: processed_logprobs
    scheduling_policy: fcfs
    log_prob_micro_batch_size: null
    log_prob_micro_batch_size_per_gpu: 8
    log_prob_use_dynamic_bsz: false
    log_prob_max_token_len_per_gpu: 16384
    disable_log_stats: true
    multi_stage_wake_up: false
    engine_kwargs:
      vllm: {}
      sglang: {}
      trtllm: {}
    val_kwargs:
      _target_: verl.workers.config.SamplingConfig
      top_k: -1
      top_p: 1.0
      temperature: 0
      n: 1
      do_sample: false
    multi_turn:
      _target_: verl.workers.config.MultiTurnConfig
      enable: false
      max_assistant_turns: null
      tool_config_path: null
      max_user_turns: null
      max_parallel_calls: 1
      max_tool_response_length: 256
      tool_response_truncate_side: middle
      interaction_config_path: null
      use_inference_chat_template: false
      tokenization_sanity_check_mode: strict
      format: hermes
      num_repeat_rollouts: null
    calculate_log_probs: false
    agent:
      _target_: verl.workers.config.AgentLoopConfig
      num_workers: 8
      default_agent_loop: single_turn_agent
      agent_loop_config_path: null
      custom_async_server:
        _target_: verl.workers.config.CustomAsyncServerConfig
        path: null
        name: null
    checkpoint_engine:
      _target_: verl.workers.config.CheckpointEngineConfig
      backend: naive
      update_weights_bucket_megabytes: 2048
      engine_kwargs: {}
    trace:
      _target_: verl.workers.config.TraceConfig
      project_name: null
      experiment_name: null
      backend: null
      token2text: false
      max_samples_per_step_per_worker: null
    skip_rollout: false
    skip_dump_dir: /tmp/rollout_dump
    skip_tokenizer_init: true
    enable_rollout_routing_replay: false
    layered_summon: false
    limit_images: null
    quantization: null
    quantization_config_file: null
    mtp: null
    qat: null
    profiler:
      _target_: verl.utils.profiler.ProfilerConfig
      tool: null
      enable: false
      all_ranks: false
      ranks: []
      save_path: null
      tool_config:
        npu:
          _target_: verl.utils.profiler.config.NPUToolConfig
          contents: []
          level: "level0"
          analysis: true
          discrete: false
        torch:
          _target_: verl.utils.profiler.config.TorchProfilerToolConfig
          contents: []
          discrete: false
    prometheus:
      _target_: verl.workers.config.PrometheusConfig
      enable: false
      port: 9090
      file: /tmp/ray/session_latest/metrics/prometheus/prometheus.yml
      served_model_name: null

  ref:
    fsdp_config:
      param_offload: false
      wrap_policy:
        min_num_params: 0
    log_prob_micro_batch_size: null
    log_prob_micro_batch_size_per_gpu: 8
    log_prob_use_dynamic_bsz: false
    log_prob_max_token_len_per_gpu: 16384
    ulysses_sequence_parallel_size: 1

# ─── Critic ───────────────────────────────────────────────────────────────────
critic:
  _target_: verl.workers.config.FSDPCriticConfig
  enable: true
  model:
    _target_: verl.workers.config.FSDPCriticModelCfg
    path: "Qwen/Qwen3-4B"
    tokenizer_path: "Qwen/Qwen3-4B"
    external_lib: null
    override_config:
      attn_implementation: flash_attention_2
    enable_gradient_checkpointing: true
    enable_activation_offload: false
    trust_remote_code: true
  strategy: fsdp
  ppo_micro_batch_size: null
  ppo_micro_batch_size_per_gpu: 1
  use_dynamic_bsz: false
  ppo_max_token_len_per_gpu: 16384
  ulysses_sequence_parallel_size: 1
  optim:
    _target_: verl.workers.config.FSDPOptimizerConfig
    lr: 1e-5
    lr_warmup_steps: -1
    lr_warmup_steps_ratio: 0.0
    min_lr_ratio: 0.0
    num_cycles: 0.5
    lr_scheduler_type: constant
    total_training_steps: -1
  engine:
    _target_: verl.workers.config.FSDPEngineConfig
    wrap_policy:
      min_num_params: 0
    param_offload: false
    optimizer_offload: false
    fsdp_size: -1

# ─── Reward Model (legacy, pre-migration) ────────────────────────────────────
# veRL's migrate_legacy_reward_impl reads ALL these keys and migrates them
# to the new reward.* namespace. Every key must exist (even as null) or
# Hydra/OmegaConf strict mode throws ConfigAttributeError.
reward_model:
  enable: false
  model:
    input_tokenizer: null
    path: "Qwen/Qwen3-8B"
    external_lib: null
    trust_remote_code: true
    fsdp_config:
      min_num_params: 0
      param_offload: false
  enable_resource_pool: false
  nnodes: 0
  n_gpus_per_node: 1
  micro_batch_size_per_gpu: 4
  max_length: null
  num_workers: null
  reward_manager: naive
  reward_loop_source: null
  reward_loop_module_path: null
  reward_loop_class_name: null
  reward_kwargs: null
  rollout:
    name: vllm
    dtype: bfloat16
    gpu_memory_utilization: 0.5
    enforce_eager: true
    cudagraph_capture_sizes: null
    free_cache_engine: true
    data_parallel_size: 1
    expert_parallel_size: 1
    tensor_model_parallel_size: 1
    max_num_batched_tokens: 8192
    max_model_len: null
    max_num_seqs: 1024
    load_format: auto
    engine_kwargs: {}
    limit_images: null
    enable_chunked_prefill: true
    enable_prefix_caching: true
    disable_log_stats: true
    skip_tokenizer_init: false
    prompt_length: 2048
    response_length: 2048

# ─── Custom Reward Function ──────────────────────────────────────────────────
custom_reward_function:
  path: scripts.self_play.agentic_reward
  name: compute_score

# ─── Sandbox Fusion (required by migrate_legacy_reward_impl) ─────────────────
sandbox_fusion:
  url: null
  max_concurrent: null
  memory_limit_mb: null

# ─── Reward (post-migration target) ──────────────────────────────────────────
reward:
  num_workers: 8
  custom_reward_function:
    path: null
    name: compute_score
  reward_manager:
    source: register
    name: naive
    module:
      path: null
      name: custom_reward_manager
  reward_model:
    enable: false
    enable_resource_pool: false
    n_gpus_per_node: 1
    nnodes: 0
    model_path: null
    rollout:
      name: vllm
      dtype: bfloat16
      gpu_memory_utilization: 0.5
      enforce_eager: true
      cudagraph_capture_sizes: null
      free_cache_engine: true
      data_parallel_size: 1
      expert_parallel_size: 1
      tensor_model_parallel_size: 1
      max_num_batched_tokens: 8192
      max_model_len: null
      max_num_seqs: 1024
      load_format: auto
      engine_kwargs: {}
      limit_images: null
      enable_chunked_prefill: true
      enable_prefix_caching: true
      disable_log_stats: true
      skip_tokenizer_init: false
      prompt_length: 2048
      response_length: 2048
  sandbox_fusion:
    url: null
    max_concurrent: 64
    memory_limit_mb: 1024

# ─── Algorithm (REINFORCE++) ─────────────────────────────────────────────────
algorithm:
  _target_: verl.trainer.config.AlgoConfig
  gamma: 1.0
  lam: 0.95
  adv_estimator: reinforce_plus_plus
  norm_adv_by_std_in_grpo: true
  use_kl_in_reward: false
  kl_penalty: kl
  kl_ctrl:
    _target_: verl.trainer.config.KLControlConfig
    type: fixed
    kl_coef: 0.01
    horizon: 10000
    target_kl: 0.1
  use_pf_ppo: false
  pf_ppo:
    reweight_method: pow
    weight_pow: 2.0

# ─── Trainer ──────────────────────────────────────────────────────────────────
trainer:
  balance_batch: true
  total_epochs: 10
  total_training_steps: null
  project_name: medserl_selfplay
  experiment_name: selfplay_v1
  logger: ['console']
  log_val_generations: 0
  rollout_data_dir: null
  validation_data_dir: null
  nnodes: 1
  n_gpus_per_node: 1
  save_freq: 50
  esi_redundant_time: 0
  resume_mode: auto
  resume_from_path: null
  val_before_train: false
  val_only: false
  test_freq: 50
  critic_warmup: 0
  default_hdfs_dir: null
  default_local_dir: outputs/self_play
  max_actor_ckpt_to_keep: null
  max_critic_ckpt_to_keep: null
  del_local_ckpt_after_load: false
  remove_previous_ckpt_in_save: false
  ray_wait_register_center_timeout: 300
  device: cuda
  use_legacy_worker_impl: auto

# ─── Transfer Queue ──────────────────────────────────────────────────────────
transfer_queue:
  enable: false

# ─── Global Profiler ─────────────────────────────────────────────────────────
global_profiler:
  _target_: verl.utils.profiler.ProfilerConfig
  tool: null
  steps: null
  profile_continuous_steps: false
  save_path: "outputs/profile"
  global_tool_config:
    nsys:
      _target_: verl.utils.profiler.config.NsightToolConfig
      discrete: false
    torch_memory:
      trace_alloc_max_entries: 100000
      stack_depth: 32
      context: "all"
      stacks: "all"
      kw_args: {}

# ─── Ray Configuration ───────────────────────────────────────────────────────
ray_kwargs:
  ray_init:
    num_cpus: null
  timeline_json_file: null
