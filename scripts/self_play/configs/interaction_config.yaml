# MedSeRL Two-Turn Self-Play Interaction Configuration
# Following verl's Interaction System for Multi-turn RL Training
# See: https://verl.readthedocs.io/en/latest/sglang_multiturn/interaction_system.html
#
# Game Design (from SeRL paper arXiv:2506.07468):
# - Turn 1 (Injector): Model modifies clinical note (benign OR error injection)
# - Turn 2 (Assessor): Model outputs CORRECT or the error sentence number
# - Zero-sum rewards with 3-tier localization: exact match, detection-only, miss
# - Hidden CoT: Injector's <think> is stripped before Assessor sees note
# - Per-turn temperature: Injector 0.6 (creative), Assessor 0.3 (precise)

interaction:
  - name: "medical_game"
    class_name: "scripts.self_play.interactions.medical_game_interaction.MedicalGameInteraction"
    config:
      # Prompts for Assessor (Turn 2) - detection + localization
      detection_prompts_path: "configs/prompts/detection_localization_prompts.json"
      
      # Max turns per episode
      max_turns: 2
      
      # Per-turn sampling: Injector = creative, Assessor = precise
      injector_temperature: 0.6    # Qwen3 official recommendation for thinking mode
      injector_top_p: 0.95         # Qwen3 official recommendation
      assessor_temperature: 0.3    # Low temperature for deterministic classification
      assessor_top_p: 0.95
      assessor_max_new_tokens: 3072  # Assessor needs ~1500-2500 tokens for medical reasoning + answer
      
      # Zero-sum reward values
      reward_win: 1.0
      reward_lose: -1.0
      format_bonus: 0.2
