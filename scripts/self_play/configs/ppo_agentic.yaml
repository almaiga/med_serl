# MedSeRL Agentic Self-Play PPO Configuration
# Inherits from verl's built-in ppo_trainer (fills all fields correctly)
# Only overrides what we need for single-turn vllm + agentic UMLS judge.
#
# Usage:
#   python3 -m verl.trainer.main_ppo \
#       --config-path=scripts/self_play/configs \
#       --config-name=ppo_agentic \
#       ... CLI overrides ...

hydra:
  searchpath:
    - pkg://verl.trainer.config

defaults:
  - ppo_trainer
  - _self_

data:
  max_prompt_length: 2048
  max_response_length: 4096
  train_batch_size: 32
  return_raw_chat: True
  trust_remote_code: True

actor_rollout_ref:
  hybrid_engine: True
  model:
    trust_remote_code: True
    override_config:
      attn_implementation: flash_attention_2
    enable_gradient_checkpointing: True
  rollout:
    name: vllm
    enforce_eager: True
    gpu_memory_utilization: 0.5
    load_format: dummy_dtensor
    tensor_model_parallel_size: 1
    temperature: 0.7
    top_p: 0.95
    top_k: 20
